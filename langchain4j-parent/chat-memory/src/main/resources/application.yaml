spring:
  application:
    name: chat-memory
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: "${DASHSCOPE_API_KEY}"
        max-tokens: 5000
        model-name: 'qwen-plus'
        temperature: 0.7
server:
  port: 8082
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能客服工单处理控制台 · Graph Workflow Console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235b5bf0'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ccircle cx='16' cy='7' r='2.6' fill='white'/%3E%3Ccircle cx='8' cy='17' r='2.6' fill='white' opacity='.92'/%3E%3Ccircle cx='16' cy='17' r='2.6' fill='white' opacity='.92'/%3E%3Ccircle cx='24' cy='17' r='2.6' fill='white' opacity='.92'/%3E%3Ccircle cx='16' cy='26' r='2.6' fill='white'/%3E%3Cpath d='M16 9.6 16 14.4 M16 19.6 16 23.4' stroke='white' stroke-width='1.3' opacity='.8'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f4f5f9; --bg-grad1:#eef0fa; --bg-grad2:#f7f4ff;
    --surface:#ffffff; --surface-2:#fafbfd; --surface-3:#f3f4f8;
    --text:#0f1729; --text-2:#5b6478; --text-3:#939db3;
    --border:#e6e8ef; --border-2:#eef0f5;
    --primary:#5b5bf0; --primary-2:#8b5cf6; --primary-soft:#eef0ff;
    --success:#10b981; --success-soft:#e7f8f1;
    --warning:#f59e0b; --warning-soft:#fef3e2;
    --danger:#ef4444; --danger-soft:#fdecec;
    --info:#3b82f6; --info-soft:#e8f1fe;
    --shadow-sm:0 1px 2px rgba(16,24,41,.06);
    --shadow:0 4px 16px -4px rgba(16,24,41,.10), 0 2px 6px -2px rgba(16,24,41,.06);
    --shadow-lg:0 18px 40px -12px rgba(16,24,41,.18), 0 6px 14px -6px rgba(16,24,41,.08);
    --radius:14px; --radius-sm:9px;
    --mono:'JetBrains Mono','SF Mono',ui-monospace,'Cascadia Code','Menlo',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',Roboto,Helvetica,Arial,sans-serif;
  }
  [data-theme="dark"]{
    --bg:#0a0c12; --bg-grad1:#0c0f18; --bg-grad2:#0e0a18;
    --surface:#11141d; --surface-2:#161a25; --surface-3:#1b2030;
    --text:#e7eaf3; --text-2:#9aa3b8; --text-3:#6b7488;
    --border:#232938; --border-2:#1d2230;
    --primary:#7c7cf6; --primary-2:#a78bfa; --primary-soft:#1b1d3a;
    --success:#34d399; --success-soft:#10261f;
    --warning:#fbbf24; --warning-soft:#2a200a;
    --danger:#f87171; --danger-soft:#2a1212;
    --info:#60a5fa; --info-soft:#0f1d33;
    --shadow-sm:0 1px 2px rgba(0,0,0,.4);
    --shadow:0 6px 22px -8px rgba(0,0,0,.6), 0 2px 8px -2px rgba(0,0,0,.5);
    --shadow-lg:0 24px 50px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--text); background:var(--bg);
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(1200px 600px at 85% -8%, var(--bg-grad2) 0%, transparent 55%),
      radial-gradient(900px 500px at -5% 5%, var(--bg-grad1) 0%, transparent 50%);
    background-attachment:fixed;
  }
  ::selection{background:var(--primary);color:#fff}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px;border:3px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-3);background-clip:content-box}

  /* ---------- Header ---------- */
  header.appbar{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:16px;
    padding:0 22px; height:60px;
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    backdrop-filter:saturate(180%) blur(14px);
    -webkit-backdrop-filter:saturate(180%) blur(14px);
    border-bottom:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:11px}
  .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--primary),var(--primary-2));
    display:grid;place-items:center;box-shadow:0 4px 12px -2px color-mix(in srgb,var(--primary) 60%,transparent)}
  .logo svg{width:20px;height:20px}
  .brand-text h1{font-size:15px;font-weight:650;letter-spacing:.2px;line-height:1.2}
  .brand-text p{font-size:11px;color:var(--text-3);letter-spacing:.6px;font-weight:500}
  .appbar .spacer{flex:1}
  .conn{display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:999px;font-size:12px;color:var(--text-2);max-width:320px}
  .conn .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);flex:none;position:relative}
  .conn.ok .dot{background:var(--success)}
  .conn.ok .dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;background:var(--success);opacity:.3;animation:ping 1.8s ease-out infinite}
  .conn.err .dot{background:var(--danger)}
  .conn.probing .dot{background:var(--warning);animation:connPulse 1s ease-in-out infinite}
  @keyframes ping{0%{transform:scale(.6);opacity:.5}80%,100%{transform:scale(1.8);opacity:0}}
  @keyframes connPulse{0%,100%{opacity:.45;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
  .iconbtn{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;color:var(--text-2);
    border:1px solid transparent;transition:.15s}
  .iconbtn:hover{background:var(--surface-2);border-color:var(--border);color:var(--text)}

  /* ---------- Layout ---------- */
  .layout{display:grid;grid-template-columns:386px 1fr;gap:20px;padding:20px;max-width:1640px;margin:0 auto;align-items:start}
  aside.sidebar{position:sticky;top:80px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 100px);overflow:auto;padding-right:2px}
  main.stage{min-width:0;min-height:calc(100vh - 100px)}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  .card-pad{padding:18px}

  .sec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--text-3);
    text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px}
  .sec-title .num{width:18px;height:18px;border-radius:5px;background:var(--primary-soft);color:var(--primary);
    display:grid;place-items:center;font-size:11px;font-weight:700}

  .field{margin-bottom:14px}
  .field:last-child{margin-bottom:0}
  label.lab{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--text-2);margin-bottom:7px}
  label.lab .hint{font-size:11px;color:var(--text-3);font-weight:400}
  textarea,input[type=text]{width:100%;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text);transition:.15s;resize:vertical;outline:none}
  textarea{min-height:120px;line-height:1.6}
  textarea:focus,input[type=text]:focus{border-color:var(--primary);background:var(--surface);
    box-shadow:0 0 0 3px color-mix(in srgb,var(--primary) 16%,transparent)}
  textarea::placeholder,input::placeholder{color:var(--text-3)}
  .counter{text-align:right;font-size:11px;color:var(--text-3);margin-top:5px;font-family:var(--mono)}

  .examples{display:flex;flex-direction:column;gap:7px}
  .ex-item{display:flex;align-items:center;gap:10px;padding:10px 11px;background:var(--surface-2);
    border:1px solid var(--border);border-radius:10px;transition:.14s;text-align:left;width:100%}
  .ex-item:hover{border-color:var(--primary);background:var(--primary-soft);transform:translateX(2px)}
  .ex-item .tag{font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;flex:none;letter-spacing:.3px}
  .ex-item .meta{min-width:0}
  .ex-item .meta b{display:block;font-size:12.6px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ex-item .meta span{font-size:11px;color:var(--text-3)}

  details.acc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
  summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:13px}
  summary::-webkit-details-marker{display:none}
  summary .chev{margin-left:auto;transition:.2s;color:var(--text-3)}
  details[open] summary .chev{transform:rotate(90deg)}
  .acc-body{padding:0 16px 16px}

  .note{display:flex;gap:9px;padding:11px 12px;background:var(--info-soft);border:1px solid color-mix(in srgb,var(--info) 28%,transparent);
    border-radius:10px;font-size:12px;color:var(--text-2);line-height:1.55}
  .note .ic{flex:none;color:var(--info);margin-top:1px}
  .note code{font-family:var(--mono);font-size:11.3px;background:color-mix(in srgb,var(--info) 12%,transparent);padding:1px 5px;border-radius:4px;color:var(--text)}

  .actions{display:flex;gap:10px;margin-top:4px}
  .btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:11px;
    font-weight:600;font-size:14px;transition:.16s;border:1px solid transparent;white-space:nowrap}
  .btn svg{width:17px;height:17px}
  .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;
    box-shadow:0 8px 20px -8px color-mix(in srgb,var(--primary) 80%,transparent)}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 12px 26px -8px color-mix(in srgb,var(--primary) 90%,transparent)}
  .btn-primary:active{transform:translateY(0)}
  .btn-primary:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text-2)}
  .btn-ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn-sm{padding:7px 12px;font-size:12.5px;border-radius:8px;flex:none}

  /* ---------- Empty / Loading / Result ---------- */
  .center-wrap{display:grid;place-items:center;min-height:calc(100vh - 100px);padding:20px}
  .empty{text-align:center;max-width:560px;width:100%}
  .empty h2{font-size:20px;font-weight:680;margin-bottom:7px;letter-spacing:.2px}
  .empty p{color:var(--text-2);font-size:13.5px;line-height:1.7;margin-bottom:24px}

  /* graph diagram */
  .graph{display:flex;flex-direction:column;align-items:center;gap:0;padding:20px 0 6px}
  .g-node{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    padding:9px 18px;border-radius:11px;background:var(--surface);border:1px solid var(--border);
    box-shadow:var(--shadow-sm);min-width:120px;transition:.15s}
  .g-node .nm{font-size:12.8px;font-weight:650;display:flex;align-items:center;gap:6px}
  .g-node .ds{font-size:10.5px;color:var(--text-3)}
  .g-node svg{width:14px;height:14px}
  .g-start,.g-end{background:var(--surface-3);border-style:dashed;color:var(--text-3);min-width:90px}
  .g-start .nm,.g-end .nm{font-weight:700;letter-spacing:.5px}
  .g-classify{border-color:color-mix(in srgb,var(--primary) 40%,transparent);background:var(--primary-soft)}
  .g-classify .nm{color:var(--primary)}
  .g-review{border-color:color-mix(in srgb,var(--warning) 40%,transparent);background:var(--warning-soft)}
  .g-review .nm{color:var(--warning)}
  .g-output{border-color:color-mix(in srgb,var(--primary-2) 40%,transparent)}
  .g-output .nm{color:var(--primary-2)}
  .g-arrow{width:2px;height:18px;background:var(--border);position:relative}
  .g-arrow::after{content:"";position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);
    border:4px solid transparent;border-top:6px solid var(--border)}
  .g-fanout{display:flex;flex-direction:column;align-items:center;gap:6px;margin:2px 0}
  .g-fanout .lbl{font-size:10.5px;color:var(--text-3);background:var(--surface);padding:2px 9px;border-radius:999px;border:1px solid var(--border)}
  .g-branch{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .g-agent{min-width:104px}
  .g-agent .nm{font-size:12px}
  .g-agent .ds{font-size:10px}
  .g-agent.refund{border-color:color-mix(in srgb,#3b82f6 40%,transparent)}
  .g-agent.refund .nm{color:#3b82f6}
  .g-agent.tech{border-color:color-mix(in srgb,#10b981 40%,transparent)}
  .g-agent.tech .nm{color:#10b981}
  .g-agent.general{border-color:color-mix(in srgb,#8b5cf6 40%,transparent)}
  .g-agent.general .nm{color:#8b5cf6}
  [data-theme="dark"] .g-agent.refund .nm{color:#93c5fd}
  [data-theme="dark"] .g-agent.tech .nm{color:#6ee7b7}
  [data-theme="dark"] .g-agent.general .nm{color:#c4b5fd}
  .g-loop{font-size:10px;color:var(--warning);background:var(--warning-soft);
    padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--warning) 30%,transparent);margin-top:6px}

  /* pipeline loading */
  .load-card{max-width:520px}
  .load-card h2{font-size:18px;font-weight:680;margin-bottom:5px;display:flex;align-items:center;gap:11px;justify-content:center}
  .load-card .sub{color:var(--text-2);font-size:13px;margin-bottom:20px;text-align:center}
  .spin{width:19px;height:19px;border:2.5px solid var(--primary-soft);border-top-color:var(--primary);border-radius:50%;animation:sp 1s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}
  .shimmer{position:relative;height:4px;border-radius:4px;background:var(--surface-3);overflow:hidden;margin:0 0 18px}
  .shimmer::after{content:"";position:absolute;inset:0;width:38%;border-radius:4px;
    background:linear-gradient(90deg,transparent,var(--primary),var(--primary-2),transparent);animation:shim 1.3s ease-in-out infinite}
  @keyframes shim{0%{transform:translateX(-130%)}100%{transform:translateX(380%)}}
  .elapsed{text-align:center;margin-top:6px;font-family:var(--mono);font-size:12px;color:var(--text-3)}
  .elapsed b{color:var(--primary)}

  /* result */
  .result-wrap{max-width:820px;margin:0 auto}
  .badges{display:flex;flex-wrap:wrap;gap:9px;margin-bottom:16px}
  .badge{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;background:var(--surface);
    border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-sm);font-size:12.5px}
  .badge .k{color:var(--text-3);font-size:11px}
  .badge .v{font-weight:680;font-family:var(--mono)}
  .badge .v.txt{font-family:var(--sans)}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:7px;letter-spacing:.3px}
  .pill.REFUND{background:color-mix(in srgb,#3b82f6 16%,transparent);color:#3b82f6}
  .pill.TECH{background:color-mix(in srgb,#10b981 16%,transparent);color:#10b981}
  .pill.GENERAL{background:color-mix(in srgb,#8b5cf6 16%,transparent);color:#8b5cf6}
  .pill.OTHER{background:var(--surface-3);color:var(--text-2)}
  [data-theme="dark"] .pill.REFUND{color:#93c5fd}
  [data-theme="dark"] .pill.TECH{color:#6ee7b7}
  [data-theme="dark"] .pill.GENERAL{color:#c4b5fd}

  .block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-sm);margin-bottom:16px;overflow:hidden}
  .block-hd{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border-2)}
  .block-hd .ti{font-weight:660;font-size:14.5px;display:flex;align-items:center;gap:9px}
  .block-hd .ti svg{width:16px;height:16px;color:var(--primary)}
  .block-hd .tools{margin-left:auto;display:flex;gap:6px}

  .md{padding:8px 22px 22px}
  .md h1{font-size:21px;font-weight:720;margin:18px 0 10px;letter-spacing:-.3px}
  .md h2{font-size:16px;font-weight:680;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border-2)}
  .md h3{font-size:14px;font-weight:660;margin:13px 0 6px}
  .md p{margin:9px 0;color:var(--text);line-height:1.8}
  .md ul,.md ol{margin:9px 0;padding-left:24px}
  .md li{margin:4px 0;line-height:1.72}
  .md li::marker{color:var(--primary)}
  .md strong{font-weight:680}
  .md em{font-style:italic;color:var(--text-2)}
  .md a{color:var(--primary);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--primary) 35%,transparent)}
  .md blockquote{margin:11px 0;padding:8px 16px;border-left:3px solid var(--primary);background:var(--surface-2);border-radius:0 8px 8px 0;color:var(--text-2)}
  .md hr{border:none;border-top:1px solid var(--border);margin:16px 0}
  .md code{font-family:var(--mono);font-size:.86em;background:var(--surface-3);padding:2px 6px;border-radius:5px;color:var(--primary-2)}
  .md pre{background:var(--surface-3);padding:14px 16px;border-radius:10px;overflow:auto;margin:11px 0;border:1px solid var(--border-2)}
  .md pre code{background:none;padding:0;font-size:12.5px;color:var(--text)}

  .err-box{padding:18px}
  .err-box .ttl{display:flex;align-items:center;gap:9px;font-weight:660;color:var(--danger);margin-bottom:10px}
  .err-box .msg{font-family:var(--mono);font-size:12.5px;background:var(--surface-3);border:1px solid var(--border);
    border-radius:9px;padding:12px;white-space:pre-wrap;word-break:break-word;color:var(--text-2);max-height:240px;overflow:auto}

  /* toast */
  #toasts{position:fixed;top:74px;right:20px;z-index:200;display:flex;flex-direction:column;gap:9px;max-width:340px}
  .toast{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--surface);
    border:1px solid var(--border);border-radius:11px;box-shadow:var(--shadow-lg);font-size:13px;animation:slideIn .25s ease}
  .toast.out{animation:slideOut .25s ease forwards}
  @keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes slideOut{to{transform:translateX(40px);opacity:0}}
  .toast .ic{flex:none;margin-top:1px}
  .toast.success .ic{color:var(--success)} .toast.error .ic{color:var(--danger)} .toast.info .ic{color:var(--info)}
  .toast b{display:block;margin-bottom:1px} .toast span{color:var(--text-2);font-size:12.5px}

  @media (max-width:1080px){
    .layout{grid-template-columns:1fr}
    aside.sidebar{position:static;max-height:none}
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="5" r="2.2" fill="#fff"/><circle cx="5.5" cy="13" r="2.2" fill="#fff" opacity=".92"/><circle cx="12" cy="13" r="2.2" fill="#fff" opacity=".92"/><circle cx="18.5" cy="13" r="2.2" fill="#fff" opacity=".92"/><circle cx="12" cy="20" r="2.2" fill="#fff"/><path d="M12 7.2v3.6M12 15.2v2.6" stroke="#fff" stroke-width="1.1" opacity=".8"/></svg>
    </div>
    <div class="brand-text">
      <h1>智能客服工单处理控制台</h1>
      <p>GRAPH WORKFLOW CONSOLE</p>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="conn" id="conn" title="后端连接状态 · 点击重新检测" style="cursor:pointer">
    <span class="dot"></span><span id="connLabel">检测中…</span>
  </div>
  <button class="iconbtn" id="themeBtn" title="切换主题">
    <svg id="iconMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<div class="layout">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar">
    <div class="card card-pad">
      <div class="sec-title"><span class="num">1</span>工单内容</div>
      <div class="field">
        <label class="lab">客户工单 <span class="hint">必填 · Ctrl/⌘+Enter 提交</span></label>
        <textarea id="content" placeholder="例如：我买的产品（订单号 ORD-2024-001）有质量问题，要求退款！"></textarea>
        <div class="counter"><span id="charCnt">0</span> 字</div>
      </div>
    </div>

    <div class="card card-pad">
      <div class="sec-title"><span class="num">2</span>快速示例</div>
      <div class="examples" id="examples"></div>
    </div>

    <details class="acc">
      <summary>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
        连接设置
        <span class="chev">›</span>
      </summary>
      <div class="acc-body">
        <div class="field" style="margin-bottom:10px">
          <label class="lab">后端服务地址</label>
          <input type="text" id="baseUrl" placeholder="http://localhost:8080" />
        </div>
        <div class="note">
          <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          <div>直接双击用浏览器打开时若遇跨域 (CORS)，最省事的做法：把本文件复制到 <code>src/main/resources/static/</code>，启动后端后访问 <code>http://localhost:8080/index.html</code>（同源，无跨域问题）。</div>
        </div>
      </div>
    </details>

    <div class="actions">
      <button class="btn btn-primary" id="runBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3Z"/></svg>
        <span>提交工单</span>
      </button>
      <button class="btn btn-ghost" id="clearBtn" style="flex:0 0 52px" title="清空">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="17" height="17"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
      </button>
    </div>
  </aside>

  <!-- ============ STAGE ============ -->
  <main class="stage" id="stage"></main>
</div>

<div id="toasts"></div>

<script>
"use strict";
/* ============ 配置 ============ */
const API_PATH = "/api/ticket";
const DEFAULT_BASE = "http://localhost:8080";

const EXAMPLES = [
  {tag:"REFUND", tagText:"退款", content:"我买的产品（订单号 ORD-2024-001）有质量问题，要求退款！", desc:"触发退款 Agent + 订单查询工具"},
  {tag:"TECH", tagText:"技术", content:"App 登录页面报错 500，一直无法登录，请尽快修复！", desc:"触发技术 Agent + 知识库工具"},
  {tag:"GENERAL", tagText:"通用", content:"你们的服务态度太差了！等了半小时都没人接电话！", desc:"触发通用 Agent"}
];

const state = { loading:false };
const $ = (id)=>document.getElementById(id);
const stage = $("stage");

/* ============ 持久化 / 主题 ============ */
function loadCfg(){
  try{
    $("baseUrl").value = localStorage.getItem("gw_base") || DEFAULT_BASE;
    const theme = localStorage.getItem("gw_theme");
    if(theme==="dark") document.documentElement.setAttribute("data-theme","dark");
    updateThemeIcon();
    probeConn();
  }catch(e){}
}
function isDark(){ return document.documentElement.getAttribute("data-theme")==="dark"; }
function updateThemeIcon(){
  $("iconMoon").innerHTML = isDark()
    ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
    : '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
}
$("themeBtn").onclick = ()=>{
  if(isDark()) document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme","dark");
  try{localStorage.setItem("gw_theme", isDark()?"dark":"light")}catch(e){}
  updateThemeIcon();
};

/* ============ 连接状态 ============ */
function setConn(s){
  const el=$("conn"), lb=$("connLabel");
  el.classList.remove("ok","err","probing");
  if(s==="connected"){ el.classList.add("ok"); lb.textContent="已连接"; }
  else if(s==="error"){ el.classList.add("err"); lb.textContent="连接异常"; }
  else if(s==="probing"){ el.classList.add("probing"); lb.textContent="检测中…"; }
  else { lb.textContent="待发起请求"; }
}
let probeCtl=null;
async function probeConn(){
  const base=currentBase(); setConn("probing");
  if(probeCtl){ try{probeCtl.abort();}catch(e){} }
  probeCtl = (typeof AbortController!=="undefined")?new AbortController():null;
  try{
    await fetch(base+API_PATH,{method:"GET",mode:"no-cors",signal:probeCtl?probeCtl.signal:undefined});
    setConn("connected");
  }catch(e){ if(e&&e.name==="AbortError") return; setConn("error"); }
}
function currentBase(){ let b=($("baseUrl").value||"").trim().replace(/\/+$/,""); return b||DEFAULT_BASE; }
$("baseUrl").addEventListener("change",(e)=>{ try{localStorage.setItem("gw_base",e.target.value.trim())}catch(_){}; probeConn(); });
$("conn").addEventListener("click", probeConn);

/* ============ 字数 ============ */
const contentEl=$("content");
function updCount(){ $("charCnt").textContent = contentEl.value.length; }
contentEl.addEventListener("input",updCount);

/* ============ 示例 ============ */
function renderExamples(){
  const wrap=$("examples"); wrap.innerHTML="";
  EXAMPLES.forEach(ex=>{
    const b=document.createElement("button"); b.className="ex-item";
    b.innerHTML = `<span class="pill ${ex.tag}" style="background:var(--surface-3);color:var(--text-2)">${ex.tagText}</span>
      <span class="meta"><b>${ex.content}</b><span>${ex.desc}</span></span>`;
    b.onclick=()=>{ contentEl.value=ex.content; updCount(); contentEl.focus(); };
    wrap.appendChild(b);
  });
}

/* ============ Markdown 渲染（轻量自实现，离线可用） ============ */
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function inlineMd(s){
  return s
    .replace(/`([^`]+)`/g,(m,c)=>`<code>${escapeHtml(c)}</code>`)
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
    .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g,"<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(md){
  if(!md) return "<p style='color:var(--text-3)'>（无内容）</p>";
  md = md.replace(/\r\n/g,"\n");
  const codeBlocks=[]; let text=md;
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g,(m,lang,code)=>{
    codeBlocks.push({lang,code:code.replace(/\n$/,"")}); return `@@CB${codeBlocks.length-1}@@`;
  });
  const lines=text.split("\n");
  let html="",i=0,inUl=false,inOl=false;
  const closeLists=()=>{ if(inUl){html+="</ul>";inUl=false;} if(inOl){html+="</ol>";inOl=false;} };
  while(i<lines.length){
    let line=lines[i];
    const cb=line.match(/^@@CB(\d+)@@$/);
    if(cb){ closeLists(); const blk=codeBlocks[+cb[1]];
      html+=`<pre><code class="lang-${escapeHtml(blk.lang)}">${escapeHtml(blk.code)}</code></pre>`; i++; continue; }
    if(!line.trim()){ closeLists(); i++; continue; }
    let m;
    if(m=line.match(/^(#{1,6})\s+(.*)$/)){ closeLists(); const lv=m[1].length; html+=`<h${lv}>${inlineMd(escapeHtml(m[2]))}</h${lv}>`; i++; continue; }
    if(m=line.match(/^\s*([-*+])\s+(.*)$/)){ if(inOl){html+="</ol>";inOl=false;} if(!inUl){html+="<ul>";inUl=true;} html+=`<li>${inlineMd(escapeHtml(m[2]))}</li>`; i++; continue; }
    if(m=line.match(/^\s*(\d+)\.\s+(.*)$/)){ if(inUl){html+="</ul>";inUl=false;} if(!inOl){html+="<ol>";inOl=true;} html+=`<li>${inlineMd(escapeHtml(m[2]))}</li>`; i++; continue; }
    if(m=line.match(/^\s*>+\s?(.*)$/)){ closeLists(); html+=`<blockquote>${inlineMd(escapeHtml(m[1]))}</blockquote>`; i++; continue; }
    if(m=line.match(/^\s*(-{3,}|\*{3,}|_{3,})\s*$/)){ closeLists(); html+="<hr/>"; i++; continue; }
    closeLists();
    let para=line; i++;
    while(i<lines.length && lines[i].trim() && !/^(#{1,6}\s|[-*+]\s|\d+\.\s|>|```|@@CB)/.test(lines[i])){ para+="\n"+lines[i]; i++; }
    html+=`<p>${inlineMd(escapeHtml(para)).replace(/\n/g,"<br/>")}</p>`;
  }
  closeLists();
  return html;
}

/* ============ 响应解析：[分类: X] [处理次数: N]\n正文 ============ */
function parseResponse(raw){
  if(raw==null) raw="";
  const m = raw.match(/^\s*\[分类:\s*([^\]]+)\]\s*\[处理次数:\s*(\d+)\]\s*[\r\n]+([\s\S]*)$/);
  if(m) return {category:m[1].trim().toUpperCase(), count:parseInt(m[2],10), body:m[3]};
  return {category:null, count:null, body:raw};
}
function catPillClass(cat){
  if(cat==="REFUND"||cat==="TECH"||cat==="GENERAL") return cat;
  return "OTHER";
}

/* ============ 工具 ============ */
function fmtMs(ms){ if(ms==null) return "—"; if(ms<1000) return ms+" ms"; return (ms/1000).toFixed(ms<10000?2:1)+" s"; }
function copyText(text){
  navigator.clipboard?.writeText(text).then(
    ()=>toast("success","已复制","回复已写入剪贴板"),
    ()=>{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
      try{document.execCommand("copy");toast("success","已复制","回复已写入剪贴板");}catch(e){toast("error","复制失败","请手动选择");}
      document.body.removeChild(ta); });
}
function toast(type,title,msg){
  const wrap=$("toasts"), t=document.createElement("div"); t.className="toast "+type;
  const icons={success:'<polyline points="20 6 9 17 4 12"/>',error:'<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>'};
  t.innerHTML=`<svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${icons[type]}</svg><div><b>${title}</b>${msg?`<span>${msg}</span>`:""}</div>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),250); },3600);
}

/* ============ 渲染：空态（Graph 工作流图） ============ */
function renderEmpty(){
  stage.innerHTML = `<div class="center-wrap"><div class="empty card card-pad" style="box-shadow:var(--shadow)">
    <h2>Graph 工单处理工作流</h2>
    <p>填写左侧工单内容并提交，系统将在下方工作流图中依次流转：<br/>智能分类 → 按类路由专业 Agent → 质量审核（不通过自动重试）→ 格式化输出。</p>
    <div class="graph">
      <div class="g-node g-start"><span class="nm">START</span></div>
      <div class="g-arrow"></div>
      <div class="g-node g-classify"><span class="nm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h12"/></svg>classify · 智能分类</span><span class="ds">LLM 判定 REFUND / TECH / GENERAL</span></div>
      <div class="g-fanout"><span class="lbl">按分类结果路由</span></div>
      <div class="g-branch">
        <div class="g-node g-agent refund"><span class="nm">refundAgent</span><span class="ds">退款 · 订单查询</span></div>
        <div class="g-node g-agent tech"><span class="nm">techAgent</span><span class="ds">技术 · 知识库</span></div>
        <div class="g-node g-agent general"><span class="nm">generalAgent</span><span class="ds">通用回复</span></div>
      </div>
      <div class="g-fanout"><span class="lbl">三路汇聚</span></div>
      <div class="g-node g-review"><span class="nm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>review · 质量审核</span><span class="ds">LLM 评估回复质量 PASS / FAIL</span><span class="g-loop">↻ 不通过则重试，最多 2 次</span></div>
      <div class="g-arrow"></div>
      <div class="g-node g-output"><span class="nm">output · 格式化输出</span><span class="ds">组装最终回复</span></div>
      <div class="g-arrow"></div>
      <div class="g-node g-end"><span class="nm">END</span></div>
    </div>
  </div></div>`;
}

/* ============ 渲染：加载态 ============ */
let elapsedTimer=null, t0=0;
function renderLoading(){
  stage.innerHTML = `<div class="center-wrap"><div class="load-card card card-pad" style="box-shadow:var(--shadow)">
    <div class="shimmer"></div>
    <h2><span class="spin"></span>工单处理中</h2>
    <p class="sub">工作流节点正在后端依次执行，预计需要 5–30 秒，请耐心等待完成。</p>
    <div class="elapsed">已用时 <b>0.0s</b></div>
  </div></div>`;
  t0=performance.now();
  elapsedTimer=setInterval(()=>{ const el=stage.querySelector(".elapsed b"); if(el) el.textContent=((performance.now()-t0)/1000).toFixed(1)+"s"; },100);
}

/* ============ 渲染：结果 ============ */
function renderResult(rawResponse, elapsedMs){
  const parsed = parseResponse(rawResponse);
  const ok = rawResponse && rawResponse!=="处理失败";
  const catBadge = parsed.category
    ? `<div class="badge"><span class="k">分类</span><span class="pill ${catPillClass(parsed.category)}">${escapeHtml(parsed.category)}</span></div>`
    : `<div class="badge"><span class="k">分类</span><span class="pill OTHER">未知</span></div>`;
  const countBadge = parsed.count!=null
    ? `<div class="badge"><span class="k">处理次数</span><span class="v">${parsed.count}</span></div>` : "";

  stage.innerHTML = `<div class="result-wrap">
    <div class="badges">
      ${catBadge}
      ${countBadge}
      <div class="badge"><span class="k">耗时</span><span class="v">${fmtMs(elapsedMs).split(" ")[0]}<span style="font-size:11px;color:var(--text-3);margin-left:2px">${fmtMs(elapsedMs).split(" ")[1]||""}</span></span></div>
      <div class="badge"><span class="k">状态</span><span class="v txt" style="color:${ok?'var(--success)':'var(--danger)'}">${ok?'已完成':'处理失败'}</span></div>
    </div>

    <div class="block">
      <div class="block-hd"><div class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>客服回复</div>
        <div class="tools">
          <button class="btn btn-ghost btn-sm" id="cpBtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>复制</button>
        </div></div>
      <div class="md" id="respMd">${renderMarkdown(parsed.body)}</div>
    </div>
  </div>`;

  $("cpBtn").onclick = ()=>copyText(parsed.body||"");
  if(ok) toast("success","处理完成", parsed.category?`分类 ${parsed.category} · ${fmtMs(elapsedMs)}`:`${fmtMs(elapsedMs)}`);
  else toast("error","处理失败","工作流未返回有效结果");
}

/* ============ 渲染：错误 ============ */
function renderError(err,isCors){
  stage.innerHTML = `<div class="center-wrap"><div style="max-width:560px;width:100%">
    <div class="block"><div class="err-box">
      <div class="ttl"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg>请求失败</div>
      <div class="msg">${escapeHtml(err)}</div>
      ${isCors?`<div class="note" style="margin-top:13px;background:var(--warning-soft);border-color:color-mix(in srgb,var(--warning) 28%,transparent)">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
        <div>这通常是<b>跨域 (CORS) 拦截</b>或<b>后端未启动</b>导致。解决方案任选其一：<br/>
        ① 将本文件放入 <code>src/main/resources/static/</code>，启动后端后访问 <code>http://localhost:8080/index.html</code>（同源，推荐）；<br/>
        ② 确认后端已在 <code>${escapeHtml(currentBase())}</code> 启动；<br/>
        ③ 若要从本地文件直接访问，需在后端 <code>TicketController</code> 上加 <code>@CrossOrigin</code>。</div>
      </div>`:`<div class="note" style="margin-top:13px">
        <svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <div>请检查后端服务 (<code>${escapeHtml(currentBase())}</code>) 是否正常运行，或调整左侧「连接设置」中的地址。</div>
      </div>`}
    </div></div></div></div>`;
  toast("error","请求失败", isCors?"疑似跨域/连接问题":"请检查后端服务");
}

/* ============ 提交 ============ */
async function run(){
  if(state.loading) return;
  const content = contentEl.value.trim();
  if(!content){ toast("error","请填写工单内容","工单内容为必填项"); contentEl.focus(); return; }

  state.loading=true; setBtnLoading(true);
  renderLoading();
  const base=currentBase();
  const t0=performance.now();
  try{
    const res = await fetch(base+API_PATH,{ method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({content}) });
    setConn("connected");
    let data;
    try{ data = await res.json(); }
    catch(e){ throw new Error(`响应解析失败 (HTTP ${res.status})：后端可能返回了非 JSON 内容`); }
    clearInterval(elapsedTimer); elapsedTimer=null;
    const elapsed = Math.round(performance.now()-t0);
    if(!res.ok){
      const serverMsg = data?.message||data?.error||data?.response||JSON.stringify(data);
      renderError(`HTTP ${res.status} — ${serverMsg}`, false);
      state.loading=false; setBtnLoading(false); return;
    }
    renderResult(data.response||"", elapsed);
  }catch(err){
    clearInterval(elapsedTimer); elapsedTimer=null;
    setConn("error");
    const isCors = (err instanceof TypeError) && /Failed to fetch|NetworkError|load failed/i.test(err.message);
    const detail = isCors
      ? `无法连接到 ${base}\n\n原因疑似：跨域 (CORS) 拦截 或 后端服务未启动。\n技术信息：${err.message}`
      : (err.stack||err.message||String(err));
    renderError(detail, isCors);
  }finally{
    state.loading=false; setBtnLoading(false);
  }
}
function setBtnLoading(loading){
  const btn=$("runBtn");
  if(loading){ btn.disabled=true; btn.innerHTML='<span class="spin" style="width:16px;height:16px;border-width:2px"></span><span>处理中…</span>'; }
  else{ btn.disabled=false; btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 3 14 9-14 9V3Z"/></svg><span>提交工单</span>'; }
}

/* ============ 清空 ============ */
$("clearBtn").onclick = ()=>{
  if(state.loading) return;
  contentEl.value=""; updCount(); renderEmpty(); toast("info","已清空","工单内容已重置");
};

/* ============ 初始化 ============ */
loadCfg();
updCount();
renderExamples();
renderEmpty();
$("runBtn").onclick = run;
contentEl.addEventListener("keydown",(e)=>{ if((e.ctrlKey||e.metaKey)&&e.key==="Enter") run(); });
</script>
</body>
</html>

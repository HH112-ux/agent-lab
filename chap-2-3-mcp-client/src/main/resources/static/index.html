<!-- 【说】这是项目的前端页面。一个纯 HTML + CSS + JavaScript 的聊天界面，不引入任何前端框架。
     静态文件放在项目根目录的 static 文件夹下，
     Spring Boot 默认把 static 目录作为静态资源根路径，
     直接通过 http://localhost:8081/index.html 就能访问。
     页面布局是左右两栏：左边是侧边栏显示 MCP Server 提供的三个工具，右边是主聊天区域。 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCP Client - Spring AI 智能开发助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg:#f8f7f4;
            --surface:#ffffff;
            --surface-2:#f2f0ec;
            --surface-3:#e8e5df;
            --border:#e0dcd5;
            --border-2:#cec8be;
            --text:#1a1816;
            --text-2:#5c5650;
            --text-3:#9a9490;
            --accent:#c2410c;
            --accent-soft:rgba(194,65,12,.07);
            --accent-border:rgba(194,65,12,.18);
            --green:#16a34a;
            --green-soft:rgba(22,163,74,.08);
        }
        body{
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);color:var(--text);
            height:100vh;display:flex;overflow:hidden;
            -webkit-font-smoothing:antialiased;
        }

        /* ===== SIDEBAR ===== */
        /* 【说】左侧边栏，宽度固定 272px，纵向排列，显示品牌信息和工具列表。 */
        .sidebar{
            width:272px;background:var(--surface);
            border-right:1px solid var(--border);
            display:flex;flex-direction:column;flex-shrink:0;
        }
        .sidebar-head{padding:28px 24px 22px}
        .brand{display:flex;align-items:center;gap:12px}
        .brand-mark{
            width:36px;height:36px;border-radius:10px;
            background:var(--accent);color:#fff;
            font-weight:700;font-size:15px;
            display:flex;align-items:center;justify-content:center;
            box-shadow:0 2px 8px rgba(194,65,12,.25);
        }
        .brand-text{font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.3px}
        .brand-sub{font-size:11px;color:var(--text-3);margin-top:4px;margin-left:48px;letter-spacing:.3px}

        .sidebar-divider{height:1px;background:var(--border);margin:0 24px}

        .sidebar-section{padding:20px 14px 10px}
        .section-label{
            font-size:10px;font-weight:600;color:var(--text-3);
            text-transform:uppercase;letter-spacing:1.5px;
            padding:0 12px 10px;
        }
        /* 【说】工具卡片。每个工具卡片绑定了一个 click 事件，
             点击后把对应的示例问题填入输入框，用户不需要打字就能快速测试。 */
        .tool-item{
            display:flex;align-items:center;gap:12px;
            padding:10px 12px;border-radius:10px;margin-bottom:2px;
            cursor:pointer;transition:all .15s;
            border:1px solid transparent;
        }
        .tool-item:hover{
            background:var(--surface-2);
            border-color:var(--border);
        }
        .ti-dot{
            width:34px;height:34px;border-radius:9px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;font-size:15px;
        }
        .tool-item:nth-child(1) .ti-dot{background:#fef3c7;color:#b45309}
        .tool-item:nth-child(2) .ti-dot{background:#dbeafe;color:#1d4ed8}
        .tool-item:nth-child(3) .ti-dot{background:#d1fae5;color:#047857}
        .ti-body{min-width:0}
        .ti-name{font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text)}
        .ti-params{font-size:10px;color:var(--text-3);margin-top:2px;font-family:'JetBrains Mono',monospace}

        /* 【说】侧边栏底部的连接状态指示器，显示 MCP Server 已连接。
             这只是静态文本，没有做真正的连接检测，
             因为 stdio 连接是后端管理的，前端感知不到。 */
        .sidebar-foot{
            margin-top:auto;padding:18px 24px;
            border-top:1px solid var(--border);
            display:flex;align-items:center;gap:10px;
        }
        .conn-dot{
            width:7px;height:7px;border-radius:50%;
            background:var(--green);flex-shrink:0;
            box-shadow:0 0 6px rgba(22,163,74,.3);
        }
        .conn-info{font-size:12px;color:var(--text-2);font-weight:500}
        .conn-sub{font-size:10px;color:var(--text-3);font-family:'JetBrains Mono',monospace;margin-top:1px}

        /* ===== MAIN ===== */
        .main{flex:1;display:flex;flex-direction:column;min-width:0}

        /* ===== CHAT ===== */
        .chat-area{
            flex:1;overflow-y:auto;padding:36px 52px;
            display:flex;flex-direction:column;gap:24px;
        }
        .chat-area::-webkit-scrollbar{width:4px}
        .chat-area::-webkit-scrollbar-track{background:transparent}
        .chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

        .msg{display:flex;gap:12px;animation:msg-in .3s cubic-bezier(.16,1,.3,1)}
        .msg.user{flex-direction:row-reverse}
        @keyframes msg-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

        .msg-avatar{
            width:32px;height:32px;border-radius:10px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;
            font-size:11px;font-weight:700;margin-top:2px;
        }
        .msg.user .msg-avatar{
            background:var(--accent);color:#fff;
            box-shadow:0 2px 6px rgba(194,65,12,.2);
        }
        .msg.assistant .msg-avatar{
            background:var(--surface-2);color:var(--text-3);
            border:1px solid var(--border);
        }

        .msg-body{max-width:640px;min-width:0}
        .msg-head{display:flex;align-items:baseline;gap:8px;margin-bottom:6px}
        .msg-name{font-size:12px;font-weight:600;color:var(--text-2)}
        .msg-time{font-size:10px;color:var(--text-3);font-family:'JetBrains Mono',monospace}

        .msg-bubble{
            padding:14px 18px;border-radius:12px;
            line-height:1.75;font-size:14px;
            white-space:pre-wrap;word-break:break-word;
        }
        .msg.user .msg-bubble{
            background:var(--accent);color:#fff;
        }
        .msg.assistant .msg-bubble{
            background:var(--surface);color:var(--text);
            border:1px solid var(--border);
            box-shadow:0 1px 3px rgba(0,0,0,.04);
        }

        /* 【说】mcp-tag 是工具调用的高亮标签样式。
             render 函数用正则表达式匹配返回文本中的【MCP工具：xxx】标记，
             替换成这个带样式的高亮标签，这样用户能直观看到 AI 调用了哪个工具。
             这个标记是我们在 Controller 的系统提示词里要求模型加上的，前端再把它视觉化。 */
        .mcp-tag{
            display:inline-flex;align-items:center;gap:6px;
            background:var(--accent-soft);color:var(--accent);
            padding:4px 12px;border-radius:6px;
            font-size:11px;font-weight:600;margin-bottom:10px;
            font-family:'JetBrains Mono',monospace;
            border:1px solid var(--accent-border);
        }
        .mcp-tag::before{
            content:'';width:5px;height:5px;border-radius:50%;background:var(--accent);
        }

        .thinking{
            color:var(--text-3);font-size:13px;font-weight:500;
            display:flex;align-items:center;gap:10px;
        }
        .dots{display:flex;gap:4px}
        .dots span{
            width:4px;height:4px;border-radius:50%;background:var(--text-3);
            animation:dot-pulse 1.4s ease-in-out infinite;
        }
        .dots span:nth-child(2){animation-delay:.15s}
        .dots span:nth-child(3){animation-delay:.3s}
        @keyframes dot-pulse{0%,100%{opacity:.2}50%{opacity:1}}

        /* ===== EMPTY ===== */
        .empty-state{
            flex:1;display:flex;flex-direction:column;
            align-items:center;justify-content:center;
            padding:40px;gap:8px;
        }
        .empty-icon{
            width:56px;height:56px;border-radius:16px;
            background:var(--accent);
            display:flex;align-items:center;justify-content:center;
            margin-bottom:14px;
            box-shadow:0 4px 16px rgba(194,65,12,.2);
        }
        .empty-icon svg{width:26px;height:26px;color:#fff}
        .empty-state h2{
            font-size:20px;font-weight:700;color:var(--text);letter-spacing:-.3px;
        }
        .empty-state .empty-desc{
            font-size:13px;color:var(--text-3);margin-bottom:28px;text-align:center;line-height:1.7;max-width:400px;
        }
        .ex-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:580px}
        .ex-btn{
            padding:13px 16px;border-radius:10px;
            background:var(--surface);border:1px solid var(--border);
            color:var(--text-2);cursor:pointer;font-size:13px;
            text-align:left;transition:all .15s;
            display:flex;align-items:center;gap:12px;
            font-family:'Inter',sans-serif;line-height:1.4;
        }
        .ex-btn:hover{
            border-color:var(--border-2);
            background:var(--surface-2);
            color:var(--text);
            transform:translateY(-1px);
            box-shadow:0 2px 8px rgba(0,0,0,.06);
        }
        .ex-ico{
            width:30px;height:30px;border-radius:7px;flex-shrink:0;
            display:flex;align-items:center;justify-content:center;font-size:13px;
            background:var(--surface-2);
        }
        .ex-btn:hover .ex-ico{background:var(--accent-soft)}

        /* ===== INPUT ===== */
        .input-area{padding:16px 52px 24px}
        .input-wrap{
            background:var(--surface);border:1px solid var(--border);
            border-radius:12px;transition:all .2s;
            box-shadow:0 1px 3px rgba(0,0,0,.04);
        }
        .input-wrap:focus-within{
            border-color:var(--accent-border);
            box-shadow:0 0 0 3px var(--accent-soft);
        }
        .input-inner{display:flex;align-items:flex-end;gap:6px;padding:6px 7px 6px 16px}
        .input-inner textarea{
            flex:1;border:none;background:transparent;color:var(--text);
            font-size:14px;font-family:'Inter',sans-serif;
            resize:none;outline:none;min-height:24px;max-height:140px;line-height:1.5;
            padding:6px 0;
        }
        .input-inner textarea::placeholder{color:var(--text-3)}
        .send-btn{
            width:36px;height:36px;border-radius:9px;border:none;cursor:pointer;
            background:var(--accent);color:#fff;
            display:flex;align-items:center;justify-content:center;
            transition:all .15s;flex-shrink:0;
            box-shadow:0 2px 6px rgba(194,65,12,.2);
        }
        .send-btn:hover:not(:disabled){background:#9a3412;box-shadow:0 2px 8px rgba(194,65,12,.3)}
        .send-btn:disabled{opacity:.3;cursor:not-allowed;box-shadow:none}
        .send-btn svg{width:16px;height:16px}
        .input-foot{
            display:flex;justify-content:space-between;padding:4px 16px 6px;
            font-size:10px;color:var(--text-3);
        }

        @media(max-width:768px){
            .sidebar{display:none}
            .chat-area{padding:20px 16px}
            .input-area{padding:12px 16px 16px}
            .msg-body{max-width:88%}
            .ex-grid{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<!-- 【说】侧边栏：显示品牌信息和 MCP Server 提供的三个工具。 -->
<div class="sidebar">
    <div class="sidebar-head">
        <div class="brand">
            <div class="brand-mark">M</div>
            <div class="brand-text">MCP Client</div>
        </div>
        <div class="brand-sub">Spring AI + Model Context Protocol</div>
    </div>
    <div class="sidebar-divider"></div>
    <div class="sidebar-section">
        <div class="section-label">MCP Server Tools</div>
        <!-- 【说】三个工具卡片，分别对应 MCP Server 提供的 check_port、query_process、run_maven。
             data-prompt 属性存储了对应的示例问题，点击卡片会把问题填入输入框。 -->
        <div class="tool-item" data-prompt="帮我看看8080端口被谁占了">
            <div class="ti-dot">&#128268;</div>
            <div class="ti-body">
                <div class="ti-name">check_port</div>
                <div class="ti-params">port: int</div>
            </div>
        </div>
        <div class="tool-item" data-prompt="查看本地有没有Java进程在跑">
            <div class="ti-dot">&#128196;</div>
            <div class="ti-body">
                <div class="ti-name">query_process</div>
                <div class="ti-params">name: string</div>
            </div>
        </div>
        <div class="tool-item" data-prompt="maven版本号">
            <div class="ti-dot">&#9874;</div>
            <div class="ti-body">
                <div class="ti-name">run_maven</div>
                <div class="ti-params">command, directory</div>
            </div>
        </div>
    </div>
    <div class="sidebar-foot">
        <div class="conn-dot"></div>
        <div>
            <div class="conn-info">MCP Server 已连接</div>
            <div class="conn-sub">stdio transport</div>
        </div>
    </div>
</div>

<!-- 【说】右侧主区域：包含聊天消息区和底部输入框。 -->
<div class="main">
    <!-- 【说】chat-area 是消息列表容器，所有用户消息和 AI 回复都动态添加到这里。 -->
    <div class="chat-area" id="chatArea">
        <!-- 【说】初始状态的欢迎界面，显示示例问题按钮，方便用户直接点击测试。 -->
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            </div>
            <h2>MCP 智能开发助手</h2>
            <div class="empty-desc">通过 MCP 协议调用远程工具服务器，用自然语言驱动开发工具</div>
            <div class="ex-grid">
                <button class="ex-btn" onclick="sendExample('帮我看看8080端口被谁占了')">
                    <span class="ex-ico">&#128268;</span> 帮我看看8080端口被谁占了
                </button>
                <button class="ex-btn" onclick="sendExample('看看3306端口有没有被占用')">
                    <span class="ex-ico">&#128268;</span> 看看3306端口有没有被占用
                </button>
                <button class="ex-btn" onclick="sendExample('查看本地有没有Java进程在跑')">
                    <span class="ex-ico">&#128196;</span> 查看本地有没有Java进程在跑
                </button>
                <button class="ex-btn" onclick="sendExample('查一下有没有Python进程')">
                    <span class="ex-ico">&#128196;</span> 查一下有没有Python进程
                </button>
                <button class="ex-btn" onclick="sendExample('maven版本号')">
                    <span class="ex-ico">&#9874;</span> maven版本号
                </button>
                <button class="ex-btn" onclick="sendExample('帮我编译项目，路径是 ${YOUR_WORKSPACE}/chap2-3-mcp-client')">
                    <span class="ex-ico">&#9874;</span> 帮我编译项目
                </button>
                <button class="ex-btn" style="grid-column:1/-1" onclick="sendExample('先看看8081端口占用情况，再查一下有没有Java进程')">
                    <span class="ex-ico">&#128640;</span> 先看端口再查进程（多工具联动）
                </button>
            </div>
        </div>
    </div>

    <!-- 【说】底部输入区域，包含文本输入框和发送按钮。 -->
    <div class="input-area">
        <div class="input-wrap">
            <div class="input-inner">
                <textarea id="userInput" placeholder="描述你的需求，AI 会自动调用 MCP 工具..." rows="1" onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
                </button>
            </div>
            <div class="input-foot">
                <div>Enter 发送 · Shift+Enter 换行</div>
            </div>
        </div>
    </div>
</div>

<script>
    /* 【说】下面是 JavaScript 交互逻辑。核心是 sendMessage 函数，
       它用 fetch API 发一个 POST 请求到后端的 /api/chat，请求体是用户输入的纯文本。
       发送前会先在聊天区显示一个"正在调用 MCP 工具"的加载动画，
       收到响应后移除动画，把结果渲染到页面上。 */

    // 【说】API_URL 指向后端的 /api/chat 接口，前端所有请求都发到这里。
    const API_URL='http://localhost:8081/api/chat';
    const chatArea=document.getElementById('chatArea');
    const userInput=document.getElementById('userInput');
    const sendBtn=document.getElementById('sendBtn');
    let emptyState=document.getElementById('emptyState');
    // 【说】loading 标志位，防止用户重复点击发送。
    let loading=false;

    // 【说】textarea 的 input 事件监听，实现输入框高度自适应。
    // 用户输入内容多的时候，输入框自动变高，最高 140px。
    userInput.addEventListener('input',function(){
        this.style.height='auto';
        this.style.height=Math.min(this.scrollHeight,140)+'px';
    });
    // 【说】Enter 键发送消息，Shift+Enter 换行。
    function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}
    // 【说】sendExample 用于示例按钮的点击事件，直接把预设文本填入输入框并发送。
    function sendExample(t){userInput.value=t;sendMessage()}
    // 【说】侧边栏工具卡片的点击事件，把对应的示例问题填入输入框，但不自动发送，只聚焦输入框。
    document.querySelectorAll('.tool-item').forEach(t=>{
        t.addEventListener('click',()=>{userInput.value=t.dataset.prompt;userInput.focus()});
    });
    // 【说】now 函数返回当前时间，格式 HH:MM，显示在消息的时间戳上。
    function now(){const d=new Date();return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
    // 【说】render 函数做文本到 HTML 的转换。
    // 先做 HTML 转义防止 XSS，然后用正则匹配【MCP工具：xxx】标记，替换成带样式的高亮标签。
    // 这样用户能直观看到 AI 调用了哪个工具。
    // 最后把换行符转成 <br>。
    function render(text){
        return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/【MCP工具：(.+?)】/g,'<div class="mcp-tag">$1</div>').replace(/\n/g,'<br>');
    }
    // 【说】addMsg 函数往聊天区添加一条消息。
    // 参数 role 是 'user' 或 'assistant'，content 是消息内容。
    // 如果欢迎界面还在，先移除它。然后创建消息 DOM 元素，拼上头像、昵称、时间戳和气泡内容。
    function addMsg(role,content){
        if(emptyState){emptyState.remove();emptyState=null}
        const el=document.createElement('div');el.className='msg '+role;
        const who=role==='user'?'You':'MCP Assistant';
        const txt=role==='assistant'?render(content):content.replace(/</g,'&lt;').replace(/>/g,'&gt;');
        el.innerHTML=`<div class="msg-avatar">${role==='user'?'U':'AI'}</div>
            <div class="msg-body"><div class="msg-head"><span class="msg-name">${who}</span><span class="msg-time">${now()}</span></div>
            <div class="msg-bubble">${txt}</div></div>`;
        chatArea.appendChild(el);chatArea.scrollTop=chatArea.scrollHeight;return el;
    }
    // 【说】addThinking 函数显示加载动画，三个跳动的圆点加上"正在调用 MCP 工具"的文字。
    // 等后端响应回来后，这个元素会被 remove() 掉，替换成真正的消息。
    function addThinking(){
        if(emptyState){emptyState.remove();emptyState=null}
        const el=document.createElement('div');el.className='msg assistant';el.id='thk';
        el.innerHTML=`<div class="msg-avatar">AI</div><div class="msg-body">
            <div class="msg-head"><span class="msg-name">MCP Assistant</span><span class="msg-time">${now()}</span></div>
            <div class="msg-bubble"><div class="thinking"><div class="dots"><span></span><span></span><span></span></div>正在调用 MCP 工具...</div></div></div>`;
        chatArea.appendChild(el);chatArea.scrollTop=chatArea.scrollHeight;return el;
    }
    // 【说】sendMessage 是整个前端最核心的函数。
    // 流程是：取出用户输入 → 清空输入框 → 添加用户消息气泡 → 显示加载动画 →
    // fetch POST 到后端 → 收到响应后移除动画 → 渲染 AI 回复。
    // 如果请求失败，显示错误提示，提醒用户确认后端服务是否启动。
    async function sendMessage(){
        const text=userInput.value.trim();if(!text||loading)return;
        loading=true;sendBtn.disabled=true;userInput.value='';userInput.style.height='auto';
        addMsg('user',text);const th=addThinking();
        try{
            const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:text});
            if(!r.ok)throw new Error('HTTP '+r.status);
            const result=await r.text();th.remove();addMsg('assistant',result);
        }catch(e){th.remove();addMsg('assistant','请求失败: '+e.message+'\n\n请确认后端服务已在 http://localhost:8081 启动')}
        finally{loading=false;sendBtn.disabled=false;userInput.focus()}
    }
</script>
</body>
</html>

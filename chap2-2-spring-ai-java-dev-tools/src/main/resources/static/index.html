<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI DevTools - 函数调用演示</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 16px 24px;
            border-bottom: 1px solid #2a2a2a;
            background: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        header .badge {
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 10px;
            background: #1a7a4a;
            color: #b0f0d0;
        }

        .tools-bar {
            padding: 12px 24px;
            border-bottom: 1px solid #2a2a2a;
            background: #141414;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .tools-bar .label {
            font-size: 12px;
            color: #888;
            margin-right: 4px;
        }

        .tool-chip {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 14px;
            border: 1px solid #333;
            background: #1e1e1e;
            color: #aaa;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-chip:hover {
            border-color: #4a9a6a;
            color: #4a9a6a;
            background: #1a2e22;
        }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #1a7a4a;
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #252525;
            color: #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message.system {
            align-self: center;
            background: transparent;
            color: #666;
            font-size: 12px;
            padding: 4px 0;
        }

        .message.assistant .thinking {
            color: #666;
            font-style: italic;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .typing-dots span {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #666;
            animation: blink 1.4s infinite both;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; }
            40% { opacity: 1; }
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #2a2a2a;
            background: #1a1a1a;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-area textarea {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #252525;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 160px;
            line-height: 1.5;
            transition: border-color 0.2s;
        }

        .input-area textarea:focus {
            border-color: #4a9a6a;
        }

        .input-area textarea::placeholder {
            color: #666;
        }

        .input-area button {
            padding: 12px 24px;
            border-radius: 12px;
            border: none;
            background: #1a7a4a;
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .input-area button:hover:not(:disabled) {
            background: #1f9a5a;
        }

        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #555;
            gap: 12px;
        }

        .empty-state .icon { font-size: 48px; opacity: 0.3; }
        .empty-state p { font-size: 14px; }

        .empty-state .examples {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .empty-state .example-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            background: #1a1a1a;
            color: #999;
            cursor: pointer;
            font-size: 13px;
            text-align: left;
            transition: all 0.2s;
        }

        .empty-state .example-btn:hover {
            border-color: #4a9a6a;
            color: #4a9a6a;
        }
    </style>
</head>
<body>

<header>
    <h1>Spring AI DevTools</h1>
    <span class="badge">Function Calling</span>
</header>

<div class="tools-bar">
    <span class="label">可用工具:</span>
    <span class="tool-chip" data-prompt="帮我看看8080端口被谁占了">checkPort - 查端口占用</span>
    <span class="tool-chip" data-prompt="帮我杀掉8080端口上的进程">killPort - 杀端口进程</span>
    <span class="tool-chip" data-prompt="查看本地所有Java进程">listJavaProcesses - Java进程</span>
    <span class="tool-chip" data-prompt="帮我编译当前项目，路径是 ${YOUR_WORKSPACE}/chap2-2-spring-ai-java-dev-tools">runMaven - Maven命令</span>
    <span class="tool-chip" data-prompt="把 /tmp/project 目录下的Java文件编码转成UTF-8">convertEncoding - 编码转换</span>
</div>

<div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
        <div class="icon">&#9881;</div>
        <p>Spring AI Function Calling 演示</p>
        <p>输入自然语言，AI 会自动调用对应的工具函数</p>
        <div class="examples">
            <button class="example-btn" onclick="sendExample('帮我看看8080端口被谁占了')">&#10148; 帮我看看8080端口被谁占了</button>
            <button class="example-btn" onclick="sendExample('查看本地所有Java进程')">&#10148; 查看本地所有Java进程</button>
            <button class="example-btn" onclick="sendExample('先看看8081端口占用情况，如果被占了就杀掉')">&#10148; 先看看8081端口占用情况，如果被占了就杀掉</button>
        </div>
    </div>
</div>

<div class="input-area">
    <textarea id="userInput" placeholder="输入你的问题，比如：帮我看看8080端口被谁占了" rows="1" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="sendMessage()">发送</button>
</div>

<script>
    const API_URL = 'http://localhost:8081/api/chat';
    const chatArea = document.getElementById('chatArea');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');
    let loading = false;

    // auto-resize textarea
    userInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 160) + 'px';
    });

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }

    function sendExample(text) {
        userInput.value = text;
        sendMessage();
    }

    // tool chip click
    document.querySelectorAll('.tool-chip').forEach(chip => {
        chip.addEventListener('click', () => {
            userInput.value = chip.dataset.prompt;
            userInput.focus();
        });
    });

    function addMessage(role, content) {
        if (emptyState) emptyState.remove();
        const div = document.createElement('div');
        div.className = 'message ' + role;
        div.textContent = content;
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return div;
    }

    function addThinkingIndicator() {
        if (emptyState) emptyState.remove();
        const div = document.createElement('div');
        div.className = 'message assistant';
        div.innerHTML = '<div class="thinking"><span class="typing-dots"><span></span><span></span><span></span></span> AI 正在思考并调用工具...</div>';
        chatArea.appendChild(div);
        chatArea.scrollTop = chatArea.scrollHeight;
        return div;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text || loading) return;

        loading = true;
        sendBtn.disabled = true;
        userInput.value = '';
        userInput.style.height = 'auto';

        addMessage('user', text);
        const thinkingEl = addThinkingIndicator();

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: text
            });

            if (!response.ok) {
                throw new Error('HTTP ' + response.status + ': ' + response.statusText);
            }

            const result = await response.text();
            thinkingEl.remove();
            addMessage('assistant', result);
        } catch (err) {
            thinkingEl.remove();
            addMessage('assistant', '请求失败: ' + err.message + '\n\n请确认后端服务已在 http://localhost:8081 启动');
        } finally {
            loading = false;
            sendBtn.disabled = false;
            userInput.focus();
        }
    }
</script>
</body>
</html>
